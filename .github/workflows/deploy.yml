name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: names
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}-api:latest
            ghcr.io/${{ steps.names.outputs.repo }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ steps.names.outputs.repo }}-web:latest
            ghcr.io/${{ steps.names.outputs.repo }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fingerprint disimpan sebagai secret, bukan hasil ssh-keyscan saat
          # runtime -- keyscan akan menerima host apa pun yang menjawab, jadi
          # percuma sebagai pemeriksaan.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull new images and restart
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p "${{ vars.VPS_PORT || 22 }}" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "IMAGE_TAG=$IMAGE_TAG DEPLOY_PATH='${{ vars.VPS_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          # Hanya untuk mengambil docker-compose.prod.yml versi terbaru.
          # --ff-only supaya deploy berhenti kalau ada perubahan lokal di VPS
          # yang belum di-commit, bukan menimpanya diam-diam.
          git pull --ff-only

          # Tag commit, bukan :latest, supaya jelas versi mana yang jalan dan
          # rollback tinggal mengulang perintah ini dengan IMAGE_TAG lama.
          export IMAGE_TAG
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE

      - name: Verify the site is serving
        run: |
          set -euo pipefail
          url="${{ vars.NEXT_PUBLIC_API_URL }}"
          # Beri container waktu memulai sebelum divonis gagal.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
            if [ "$code" = "200" ]; then
              echo "OK: $url/ balas 200"
              exit 0
            fi
            echo "percobaan $i: status $code, tunggu 5 detik"
            sleep 5
          done
          echo "GAGAL: $url/ tidak balas 200 setelah 60 detik"
          exit 1
