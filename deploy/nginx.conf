# Jelantara
#
#   Next.js  (frontend/)  -> 127.0.0.1:3100
#   Express  (backend/)   -> 127.0.0.1:4000
#
# Notes to Dev (Eleazer/Tazkie): copy ke /etc/nginx/sites-available/smart-tourism, terus
#   sudo ln -s /etc/nginx/sites-available/smart-tourism /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jelantara.iitech.id

upstream st_web { server 127.0.0.1:3100; }
upstream st_api { server 127.0.0.1:4000; }

server {
    listen 80;
    listen [::]:80;
    server_name jelantara.iitech.id;

    client_max_body_size 10M;

    location = /api/destination-season {
        proxy_pass http://st_web;
        include /etc/nginx/proxy_params;
    }
    location = /api/flight-calendar {
        proxy_pass http://st_web;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://st_api;
        include /etc/nginx/proxy_params;
    }

    location /api-docs {
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://st_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://st_web;
        include /etc/nginx/proxy_params;
    }

    location /_next/static/ {
        proxy_pass http://st_web;
        include /etc/nginx/proxy_params;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
